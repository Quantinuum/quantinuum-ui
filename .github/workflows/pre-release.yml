name: Pre Release library
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - run: pnpm i --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

      - name: Force prerelease config
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cat > .releaserc.json << EOF
          {
            "branches": [
              { "name": "${BRANCH_NAME}", "prerelease": true }
            ]
          }
          EOF

      - name: Debug prerelease setup
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
          echo ".releaserc.json contents:"
          cat .releaserc.json
          echo "Remote branches matching:"
          git ls-remote --heads origin ${{ github.ref_name }}

      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
